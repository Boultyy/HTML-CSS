<!DOCTYPE html>
<html>
  <head>
<title>add friend page</title>

<style>
  p {
    font-family: Arial, Helvetica, sans-serif;
    margin-top: 0px;
    margin-bottom: 0px;
  }
.profile {
  width: 200px;
  box-shadow:  0px 0px 10px rgba(53, 52, 52, 0.65);
  display: inline-block;
  margin-right: 15px;
}


.profile-pic {
  width: 200px;
  height: 200px;
  object-fit: cover;
  margin-bottom: 12px;
}
.name {
  font-size: 18px;
  font-weight: bold;
  margin-left: 8px;
  margin-bottom: 4px;
}
.mutuals {
  font-size: 13px;
  color: grey;
  margin-bottom: 4px;
  margin-left: 8px;
}
.add-friend {
  color: white;
  background-color: rgb(92, 92, 211);
  padding-left: 12px;
  padding-right: 12px;
  padding-top: 12px;
  padding-bottom: 12px;
  border-radius: 5px;
  font-weight: 500;
  margin-left: 8px;
  cursor: pointer;
}


</style>


 </head>
  <body>
   
    <div class="profile">

<img class="profile-pic" src="/thumbnails/cat.jpg">
<p class="name">
  Oliver
</p>
 
<p class="mutuals">
  2 mutual friends 
</p>

<button class="add-friend">
  Add Friend
</button>

</div>
<div class="profile">

  <img class="profile-pic" src="/thumbnails/computerrr.jpg">
  <p class="name">
    mimi
  </p>
   
  <p class="mutuals">
    3 mutual friends 
  </p>
  
  <button class="add-friend">
    Add Friend
  </button>
  
  </div>

  

</body>
</html>
