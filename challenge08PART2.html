<!DOCTYPE html>
<html>
  <head>
<title>uber request page</title>
  </head>
    <body>
<style>

input,p,button {
  margin-top: 0px;
  margin-bottom: 0px;
  font-family: Arial, Helvetica, sans-serif;
}

.text {
  font-size: 30px;
  margin-bottom: 20px;
  font-family: Arial, Helvetica, sans-serif
}
.pickup {
  display: block;
  width: 290px;
  padding-top: 10px;
  padding-bottom: 10px;
  padding-left: 5px;
  border: none;
  background-color: rgba(233, 227, 227, 0.759);
  margin-bottom: 15px;
}
.drop {
  display: block;
  width: 290px;
  padding-top: 10px;
  padding-bottom: 10px;
  padding-left: 5px;
  border: none;
  background-color: rgba(233, 227, 227, 0.759);
  margin-bottom: 25px;
}

.request {
  border: none;
  display: inline-block;
  color: white;
  background-color: black;
  padding-left: 15px;
padding-right: 15px;
padding-top: 10px;
padding-bottom: 10px;
margin-right: 20px;
cursor: pointer;
}

.schedule {
  border: none;
  display: inline-block;
  color: black;
  background-color: rgba(233, 227, 227, 0.759); ;
  padding-left: 15px;
padding-right: 15px;
padding-top: 10px;
padding-bottom: 10px;
margin-right: 20px;
cursor: pointer;
}



</style>

<p class="text">
  Request a ride now
</p>
    
  <input class="pickup" type="text" placeholder="Enter pickup location">
  <input class="drop" type="text" placeholder="Enter destination">
  <button class="request">
    Request now
  </button>
  <button class="schedule">
    Schedule for later
  </button>
</body>
</html>
