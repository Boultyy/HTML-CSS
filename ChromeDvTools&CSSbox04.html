<style>
  .subscribe-button {
    background-color:rgb(190, 1, 1);
    color: white;
    border: none;
   padding-top: 10px;
   padding-bottom: 10px;
   padding-left: 16px;
   padding-right: 16px;
  border-radius: 2px;
  cursor: pointer;
  margin-right: 8px;
  margin-left: 8px;
  transition: opacity 0.15s;
   }

   .subscribe-button:hover {
    opacity: 0.6;
   }

   .subscribe-button:active {
    opacity: 0.4;
   }

   
   .join-button{
    background-color: white;
    border-color: rgb(0, 119, 255);
    color: rgb(0, 119, 255);
   padding-top: 9px;
   padding-left: 15px;
   padding-bottom: 9px;
   padding-right: 15px;
    border-radius: 2px;
    border-style: solid;
    border-width: 1px;
    cursor: pointer;
    transition: background-color 0.15s, color 0.15s;
    
   }

   .join-button:hover {
    background-color:  rgb(0, 119, 255);
    color: white;
   }
   .join-button:active {
    opacity: 0.6;
   }

   .tweet-button{
    background-color: rgb(0, 170, 255);
    border-radius: 18px;
   padding-left: 15px;
   padding-right: 15px;
   padding-top: 9px;
   padding-bottom: 9px;
    color: white;
    font-weight: bold;
    border: none;
    font-size: 15px;
    cursor: pointer;
    margin-left: 8px;
    transition: box-shadow 0.15s;
   }
   .tweet-button:hover{
    box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
   }
</style>

<button class="subscribe-button">
  SUBSCRIBE
</button>

<button class="join-button">
  JOIN 
</button>

<button class="tweet-button">
  Tweet
</button>
