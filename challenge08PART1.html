<!DOCTYPE html>
<html>
  <head>
    <title>
sign up page
    </title>
<style>
input {
  margin-top: 0px;
  margin-bottom: 0px;
}

.first-name, .last-name {
  font-size: large;
  border-radius: 10px;
  display: inline-block;
  width: 150px;
  margin-bottom: 15px;
  padding-top: 15px;
  padding-bottom: 15px;
  padding-left: 18px;
}


.email {
  display: block;
  font-size: large;
  width: 330px;
  border-radius: 10px;
    padding-top: 15px;
  padding-bottom: 15px;
  padding-left: 18px;
  margin-bottom: 15px;
}

.button {
  text-align: center;
  color: white;
  background-color: rgb(91, 91, 241);
  border-radius: 10px;
  width: 350px;
  padding-top: 15px;
  padding-bottom: 15px;
  padding-left: 18px;
  margin-bottom: 15px;
  font-size: large;
  font-weight: bold;
}  
</style>

  </head>

  <body>

<input class="first-name" type="text" placeholder="First name"> 
<input class="last-name" type="text" placeholder="Last name">
<input class="email" type="text" placeholder="Email">
 <button class="button">
  Sign Up
 </button>
  </body>
</html>
